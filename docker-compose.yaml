version: '3'
services:
  bot:
    restart: always
    build: .
    logging:
      driver: json-file
      options:
        max-size: "50m"
    environment:
      DEBUG: ${DEBUG}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      CHROME_HEADLESS: 1
      GOOGLE_APPLICATION_CREDENTIALS: '/src/creds.json'
      OPEN_AI_KEY: ${OPEN_AI_KEY}
      GRPC_SCRAPER_ADDRESS: librus-scraper:50051
    volumes:
      - ./playwright/attachments:/app/attachments

  librus-scraper:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    restart: always
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GRPC_PORT: 50051
      NODE_ENV: production
      HTTP_PROXY_HOST: ${HTTP_PROXY_HOST}
      HTTP_PROXY_PORT: ${HTTP_PROXY_PORT}
      HTTP_PROXY_USER: ${HTTP_PROXY_USER}
      HTTP_PROXY_PASSWORD: ${HTTP_PROXY_PASSWORD}
    volumes:
      - ./playwright/sessions:/app/sessions
      - ./playwright/attachments:/app/attachments
    ports:
      - "50051:50051"  # Expose for testing
    logging:
      driver: json-file
      options:
        max-size: "50m"

  mongodb:
    image: mongo:4.4.25
    restart: always
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - .docker/data/mongodb:/data/db
#    ports:
#      - "27017:27017"
    command: mongod
    logging:
      driver: json-file
      options:
        max-size: "50m"

  mongo-express:
    image: mongo-express
    restart: always
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
    depends_on:
      - mongodb
    ports:
      - "12328:8081"
    logging:
      driver: json-file
      options:
        max-size: "50m"
